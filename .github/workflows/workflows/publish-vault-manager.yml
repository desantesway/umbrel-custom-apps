name: Publish Vault Manager image

on:
  workflow_dispatch:
  push:
    paths:
      - "custom-apps-vault-manager/**"
      - ".github/workflows/publish-vault-manager.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./custom-apps-vault-manager
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/desantesway/vault-manager:1.0.9
            ghcr.io/desantesway/vault-manager:latest
