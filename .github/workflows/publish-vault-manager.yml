
name: Publish Vault Manager image

on:
  workflow_dispatch:
  push:
    paths:
      - "vault-manager/**"
      - "custom-apps-vault-manager/**"
      - ".github/workflows/publish-vault-manager.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find Vault Manager Dockerfile
        id: app
        shell: bash
        run: |
          if [ -f "custom-apps-vault-manager/Dockerfile" ]; then
            echo "context=custom-apps-vault-manager" >> "$GITHUB_OUTPUT"
          elif [ -f "vault-manager/Dockerfile" ]; then
            echo "context=vault-manager" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find the Vault Manager Dockerfile."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ steps.app.outputs.context }}
          push: true
          tags: |
            ghcr.io/desantesway/vault-manager:1.0.0
            ghcr.io/desantesway/vault-manager:latest
