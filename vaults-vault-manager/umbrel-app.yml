manifestVersion: 1
id: vaults-vault-manager
category: files
name: Vault Manager
version: "1.0.0"
tagline: Password-protected encrypted folders on your external drive
description: >-
  Create independent gocryptfs encrypted vaults, unlock them with individual
  passwords, and browse decrypted contents from the Umbrel dashboard.
releaseNotes: >-
  Initial personal release. Includes vault creation, unlock, lock, browsing,
  and file upload/download.
developer: Personal
website: https://github.com/getumbrel/umbrel-community-app-store
dependencies: []
port: 8088
path: "/"
deterministicPassword: false
torOnly: false
