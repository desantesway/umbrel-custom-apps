version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: vaults-vault-manager_server_1
      APP_PORT: 8088

  server:
    image: vault-manager:1.0.0
    user: "0:0"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      APP_PASSWORD: "${APP_PASSWORD}"
      APP_DATA_DIR: /data
      VAULT_ROOT: /vault
      PORT: "8088"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - type: bind
        source: /home/umbrel/umbrel/external/TOSHIBA HDW/Vault
        target: /vault
        bind:
          propagation: rshared
