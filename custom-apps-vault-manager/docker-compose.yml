version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:1.0.0
    restart: on-failure
    environment:
      APP_HOST: custom-apps-vault-manager_server_1
      APP_PORT: "8088"

  server:
    image: ghcr.io/desantesway/vault-manager:1.1.0
    init: true
    restart: on-failure
    stop_grace_period: 1m
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      APP_DATA_DIR: /app-data/data
      VAULT_ROOT: /vault
      APP_DATA_ROOT: /app-data
      PORT: "8088"
    volumes:
      # Umbrel expands APP_DATA_DIR on the host to this app's persistent directory.
      - "${APP_DATA_DIR}:/app-data"
      - type: bind
        source: "/home/umbrel/umbrel/external/TOSHIBA HDW/Vault"
        target: /vault
        bind:
          propagation: rshared

      - type: bind
        source: "/home/umbrel/umbrel/external/TOSHIBA HDW"
        target: /source
        read_only: true
